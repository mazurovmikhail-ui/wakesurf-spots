<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вейксёрф-споты России</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0d1b24;
    --panel: #14252f;
    --panel-2: #1b303c;
    --line: #24404e;
    --text: #e8f1f5;
    --muted: #8fa8b5;
    --accent: #2dd4bf;
    --accent-dim: #14b8a6;
    --warn: #fbbf24;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 10px 16px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    z-index: 1001;
  }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .counter { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .gh-link {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .gh-link:hover { color: var(--accent); border-color: var(--accent-dim); }

  .controls {
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    z-index: 1000;
  }
  .controls input[type="search"] {
    flex: 1 1 160px;
    min-width: 140px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
  }
  .controls input[type="search"]:focus { border-color: var(--accent-dim); }
  .controls select {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    max-width: 46vw;
  }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .chip.on { background: var(--accent-dim); border-color: var(--accent-dim); color: #04211d; font-weight: 600; }

  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-width: 0; background: #0a141b; }

  aside {
    width: 400px;
    max-width: 45vw;
    overflow-y: auto;
    background: var(--bg);
    border-left: 1px solid var(--line);
    padding: 12px;
    scroll-behavior: smooth;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent-dim); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card h3 { font-size: 16px; margin-bottom: 2px; }
  .card .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .badge.boat { border-color: #2d6a8a; color: #9bd1ee; }
  .badge.cable { border-color: #8a6a2d; color: #eed49b; }
  .row { font-size: 13px; margin: 4px 0; display: flex; gap: 6px; line-height: 1.45; }
  .row .ico { flex: 0 0 18px; text-align: center; }
  .row .val { color: var(--text); }
  .row .val.muted { color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .links a {
    font-size: 12.5px;
    color: #04211d;
    background: var(--accent);
    padding: 6px 11px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  .links a.sec { background: var(--panel-2); color: var(--accent); border: 1px solid var(--accent-dim); font-weight: 500; }
  .links .fc-btn {
    font-size: 12.5px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .links .fc-btn:hover { border-color: var(--accent-dim); }

  .forecast { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .fc-days { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .fc-day {
    flex: 1 0 56px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
    font-size: 11px;
    line-height: 1.5;
  }
  .fc-day .d { color: var(--muted); }
  .fc-day .i { font-size: 16px; }
  .fc-wind-ok { color: #4ade80; }
  .fc-wind-mid { color: var(--warn); }
  .fc-wind-bad { color: #f87171; }
  .fc-glass { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .fc-glass b { color: var(--accent); font-weight: 600; }
  .fc-note { font-size: 10.5px; color: var(--muted); margin-top: 4px; }

  .empty { color: var(--muted); text-align: center; padding: 40px 10px; font-size: 14px; }

  /* Leaflet popup theming */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--text);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pp-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .pp-sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .pp-link { color: var(--accent); font-weight: 600; cursor: pointer; font-size: 12.5px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-control-attribution { background: rgba(13,27,36,.7) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* Mobile: map on top, list under it */
  @media (max-width: 800px) {
    main { flex-direction: column; }
    #map { flex: 0 0 42vh; }
    aside { width: 100%; max-width: none; flex: 1; border-left: none; border-top: 1px solid var(--line); }
    .controls select { max-width: none; flex: 1 1 40%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🏄 WAKE<span>СПОТЫ</span> России</div>
  <div class="counter" id="counter"></div>
  <a class="gh-link" href="https://github.com/mazurovmikhail-ui/wakesurf-spots" target="_blank" rel="noopener">GitHub</a>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Поиск: клуб, город, катер…">
  <select id="fRegion"><option value="">Все регионы</option></select>
  <select id="fCity"><option value="">Все города</option></select>
  <span class="chip" id="fTrain">🎓 с обучением</span>
  <span class="chip" id="fBoat">🚤 катер указан</span>
  <span class="chip" id="fStay">🏠 с проживанием</span>
</div>

<main>
  <div id="map"></div>
  <aside id="list"></aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const state = { q: "", region: "", city: "", train: false, boat: false, stay: false, active: -1 };

const map = L.map("map", { zoomControl: true }).setView([56.5, 44], 4);
map.attributionControl.setPrefix("");
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19
}).addTo(map);

const markers = [];

function boatIcon(active) {
  return L.divIcon({
    className: "",
    html: `<div style="font-size:${active ? 30 : 24}px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); transform: translate(-50%,-50%);">🏄</div>`,
    iconSize: [0, 0]
  });
}

function norm(s) { return (s || "").toString().toLowerCase(); }

function matches(s) {
  if (state.region && s.region !== state.region) return false;
  if (state.city && s.city !== state.city) return false;
  if (state.train && !s.training) return false;
  if (state.boat && !(s.boats && s.boats.length)) return false;
  if (state.stay && !s.stay) return false;
  if (state.q) {
    const hay = norm([s.name, s.city, s.water, s.address, (s.boats||[]).join(" "), s.notes, s.stay].join(" "));
    if (!hay.includes(norm(state.q))) return false;
  }
  return true;
}

function bookingLinks(s) {
  const b = s.booking || {};
  const out = [];
  if (b.site) out.push(`<a href="${b.site}" target="_blank" rel="noopener">Сайт</a>`);
  if (b.telegram) out.push(`<a class="sec" href="${b.telegram.startsWith('http') ? b.telegram : 'https://t.me/' + b.telegram.replace(/^@/,'')}" target="_blank" rel="noopener">Telegram</a>`);
  if (b.vk) out.push(`<a class="sec" href="${b.vk}" target="_blank" rel="noopener">VK</a>`);
  if (b.instagram) out.push(`<a class="sec" href="${b.instagram.startsWith('http') ? b.instagram : 'https://instagram.com/' + b.instagram.replace(/^@/,'')}" target="_blank" rel="noopener">Instagram</a>`);
  if (b.phone) out.push(`<a class="sec" href="tel:${b.phone.replace(/[^+\d]/g,'')}">${b.phone}</a>`);
  if (s.lat && s.lon) out.push(`<a class="sec" href="https://yandex.ru/maps/?pt=${s.lon},${s.lat}&z=15" target="_blank" rel="noopener">Я.Карты</a>`);
  return out.join("");
}

function esc(s) { return (s || "").toString().replace(/</g, "&lt;"); }

function cardHTML(s, i) {
  const boats = (s.boats || []).map(b => `<span class="badge boat">🚤 ${esc(b)}</span>`).join("");
  const cable = s.cable ? `<span class="badge cable">+ лебёдка</span>` : "";
  const rows = [];
  if (s.wave) rows.push(`<div class="row"><span class="ico">🌊</span><span class="val">${esc(s.wave)}</span></div>`);
  if (s.price) rows.push(`<div class="row"><span class="ico">💸</span><span class="val">${esc(s.price)}</span></div>`);
  if (s.season) rows.push(`<div class="row"><span class="ico">📅</span><span class="val">${esc(s.season)}</span></div>`);
  if (s.training) rows.push(`<div class="row"><span class="ico">🎓</span><span class="val">${esc(s.training)}</span></div>`);
  if (s.stay) rows.push(`<div class="row"><span class="ico">🏠</span><span class="val">${esc(s.stay)}</span></div>`);
  if (s.address) rows.push(`<div class="row"><span class="ico">📍</span><span class="val muted">${esc(s.address)}</span></div>`);
  if (s.notes) rows.push(`<div class="row"><span class="ico">💡</span><span class="val muted">${esc(s.notes)}</span></div>`);
  const fcBtn = (s.lat != null) ? `<button class="fc-btn" onclick="toggleForecast(event, ${i})">☀️ Прогноз</button>` : "";
  return `<div class="card" id="card-${i}" data-i="${i}">
    <h3>${esc(s.name)}</h3>
    <div class="sub">${esc(s.city)} · ${esc(s.water || s.region)}${s.level ? " · " + esc(s.level) : ""}</div>
    <div class="badges">${boats}${cable}</div>
    ${rows.join("")}
    <div class="links">${bookingLinks(s)}${fcBtn}</div>
    <div class="forecast" id="fc-${i}" style="display:none"></div>
  </div>`;
}

function render() {
  const list = document.getElementById("list");
  const idx = SPOTS.map((s, i) => i).filter(i => matches(SPOTS[i]));
  list.innerHTML = idx.length
    ? idx.map(i => cardHTML(SPOTS[i], i)).join("")
    : `<div class="empty">Ничего не нашлось — сбросьте фильтры</div>`;
  document.getElementById("counter").textContent =
    `${idx.length} из ${SPOTS.length} спотов`;

  markers.forEach(m => map.removeLayer(m.marker));
  markers.length = 0;
  idx.forEach(i => {
    const s = SPOTS[i];
    if (s.lat == null || s.lon == null) return;
    const m = L.marker([s.lat, s.lon], { icon: boatIcon(false) }).addTo(map);
    m.bindPopup(`<div class="pp-name">${esc(s.name)}</div>
      <div class="pp-sub">${esc(s.city)} · ${esc(s.water || "")}</div>
      ${s.price ? `<div>💸 ${esc(s.price)}</div>` : ""}
      <div class="pp-link" onclick="focusCard(${i})">Открыть карточку ↓</div>`);
    m.on("click", () => highlight(i, false));
    markers.push({ i, marker: m });
  });

  list.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => {
      const i = +c.dataset.i;
      highlight(i, true);
      const s = SPOTS[i];
      if (s.lat != null) {
        map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 11), { duration: .6 });
        const mm = markers.find(m => m.i === i);
        if (mm) mm.marker.openPopup();
      }
    });
  });
}

function highlight(i, fromList) {
  state.active = i;
  document.querySelectorAll(".card.active").forEach(c => c.classList.remove("active"));
  const el = document.getElementById("card-" + i);
  if (el) {
    el.classList.add("active");
    if (!fromList) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

function focusCard(i) { highlight(i, false); }

// ── Прогноз погоды и волны (Open-Meteo, без ключа) ──
const fcCache = {};
const WMO_ICONS = [
  [0, "☀️"], [1, "🌤"], [2, "⛅"], [3, "☁️"], [45, "🌫"], [48, "🌫"],
  [51, "🌦"], [57, "🌦"], [61, "🌧"], [67, "🌧"], [71, "🌨"], [77, "🌨"],
  [80, "🌧"], [82, "🌧"], [85, "🌨"], [86, "🌨"], [95, "⛈"], [99, "⛈"]
];
function wmoIcon(code) {
  let icon = "☁️";
  for (const [c, i] of WMO_ICONS) if (code >= c) icon = i;
  return icon;
}
function windClass(ms) { return ms <= 4 ? "fc-wind-ok" : ms <= 7 ? "fc-wind-mid" : "fc-wind-bad"; }
const DAYS_RU = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

async function toggleForecast(ev, i) {
  ev.stopPropagation();
  const box = document.getElementById("fc-" + i);
  if (box.style.display !== "none") { box.style.display = "none"; return; }
  box.style.display = "block";
  if (fcCache[i]) { box.innerHTML = fcCache[i]; return; }
  box.innerHTML = `<div class="fc-glass">Загружаю прогноз…</div>`;
  const s = SPOTS[i];
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}` +
      `&daily=weather_code,temperature_2m_max,wind_speed_10m_max,wind_gusts_10m_max,precipitation_probability_max` +
      `&hourly=wind_speed_10m&timezone=auto&forecast_days=7&wind_speed_unit=ms`;
    const wx = await (await fetch(url)).json();

    // Высота волны — только для морских акваторий
    let marine = null;
    if (/море|бухта/i.test(s.water || "") && !/обское/i.test(s.water || "")) {
      try {
        const mUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}` +
          `&daily=wave_height_max&timezone=auto&forecast_days=7`;
        const m = await (await fetch(mUrl)).json();
        if (m.daily && m.daily.wave_height_max && m.daily.wave_height_max.some(v => v != null)) marine = m.daily;
      } catch (e) { /* не море — пропускаем */ }
    }

    const d = wx.daily;
    const cells = d.time.map((t, k) => {
      const date = new Date(t + "T12:00");
      const wind = Math.round(d.wind_speed_10m_max[k]);
      const gust = Math.round(d.wind_gusts_10m_max[k]);
      const rain = d.precipitation_probability_max[k];
      const wave = marine && marine.wave_height_max[k] != null
        ? `<div>🌊 ${marine.wave_height_max[k].toFixed(1)} м</div>` : "";
      return `<div class="fc-day">
        <div class="d">${DAYS_RU[date.getDay()]} ${date.getDate()}</div>
        <div class="i">${wmoIcon(d.weather_code[k])}</div>
        <div>${Math.round(d.temperature_2m_max[k])}°</div>
        <div class="${windClass(wind)}">💨 ${wind}<span style="opacity:.6">/${gust}</span></div>
        ${rain >= 30 ? `<div>☔ ${rain}%</div>` : ""}
        ${wave}
      </div>`;
    }).join("");

    // Штилевые окна: часы 05–21 со скоростью ветра ≤ 3 м/с в ближайшие 3 дня
    const windows = [];
    const h = wx.hourly;
    for (let day = 0; day < 3 && windows.length < 3; day++) {
      let start = -1, best = null;
      for (let hr = 5; hr <= 21; hr++) {
        const idx = day * 24 + hr;
        if (idx >= h.wind_speed_10m.length) break;
        const calm = h.wind_speed_10m[idx] != null && h.wind_speed_10m[idx] <= 3;
        if (calm && start < 0) start = hr;
        if ((!calm || hr === 21) && start >= 0) {
          const end = calm ? hr : hr - 1;
          if (end - start >= 1 && (!best || end - start > best[1] - best[0])) best = [start, end + 1];
          start = -1;
        }
      }
      if (best) {
        const date = new Date(h.time[day * 24 + 12]);
        windows.push(`<b>${DAYS_RU[date.getDay()]}</b> ${best[0]}:00–${best[1]}:00`);
      }
    }
    const glass = windows.length
      ? `🪞 Штилевые окна (ветер ≤ 3 м/с): ${windows.join(", ")}`
      : `Штилевых окон в ближайшие 3 дня не видно — ловите раннее утро`;

    const wg = `https://www.windguru.cz/map/?lat=${s.lat}&lon=${s.lon}&zoom=11`;
    const wy = `https://www.windy.com/${s.lat}/${s.lon}?${s.lat},${s.lon},11`;
    const html = `<div class="fc-days">${cells}</div>
      <div class="fc-glass">${glass}</div>
      <div class="links" style="margin-top:8px">
        <a class="sec" href="${wg}" target="_blank" rel="noopener">Windguru</a>
        <a class="sec" href="${wy}" target="_blank" rel="noopener">Windy</a>
      </div>
      <div class="fc-note">💨 макс/порывы, м/с · прогноз Open-Meteo для точки спота</div>`;
    fcCache[i] = html;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="fc-glass">Не удалось загрузить прогноз — проверьте интернет</div>`;
  }
}

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  const cur = sel.value;
  sel.length = 1;
  [...new Set(values)].sort((a, b) => a.localeCompare(b, "ru")).forEach(v => {
    const o = document.createElement("option");
    o.value = o.textContent = v;
    sel.appendChild(o);
  });
  sel.value = cur;
}

function initFilters() {
  fillSelect("fRegion", SPOTS.map(s => s.region).filter(Boolean));
  fillSelect("fCity", SPOTS.map(s => s.city).filter(Boolean));
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("fRegion").addEventListener("change", e => {
  state.region = e.target.value;
  state.city = "";
  const cities = SPOTS.filter(s => !state.region || s.region === state.region).map(s => s.city).filter(Boolean);
  fillSelect("fCity", cities);
  document.getElementById("fCity").value = "";
  render();
});
document.getElementById("fCity").addEventListener("change", e => { state.city = e.target.value; render(); });
document.getElementById("fTrain").addEventListener("click", e => { state.train = !state.train; e.target.classList.toggle("on", state.train); render(); });
document.getElementById("fBoat").addEventListener("click", e => { state.boat = !state.boat; e.target.classList.toggle("on", state.boat); render(); });
document.getElementById("fStay").addEventListener("click", e => { state.stay = !state.stay; e.target.classList.toggle("on", state.stay); render(); });

initFilters();
render();
</script>
</body>
</html>
